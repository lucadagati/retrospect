apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-docker
  namespace: poc-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-docker
  template:
    metadata:
      labels:
        app: hello-docker
    spec:
      # Nessun runtimeClassName → kubelet usa il default (runc)
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-docker
  namespace: poc-runtime
spec:
  selector:
    app: hello-docker
  ports:
    - port: 80
      targetPort: 80
