# SPDX-License-Identifier: Apache-2.0
# Wasmbed OCRE firmware — Zephyr 4.4 / b_u585i_iot02a

# ── OCRE runtime ──────────────────────────────────────────────────────────────
CONFIG_OCRE=y
# HEAP_MEM_POOL_ADD_SIZE_OCRE and OCRE_STORAGE_PARTITION are set by OCRE Kconfig

# ── POSIX / Threading ─────────────────────────────────────────────────────────
CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y

# ── Filesystem (required by OCRE storage partition: LittleFS) ─────────────────
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ── Network stack ─────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y

# ── Network interface (board-specific conf sets WiFi or Ethernet) ──────────────
# CONFIG_WIFI / CONFIG_WIFI_ESWIFI are set in boards/b_u585i_iot02a.conf
CONFIG_NET_SOCKETS_OFFLOAD=n

# ── TLS (Zephyr 4.4: MbedTLS + PSA crypto) ───────────────────────────────────
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=131072
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# Gateway uses TLS 1.2 with RSA certificate (wasmbed-cert-tool generates RSA certs)
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# ── Memory ────────────────────────────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y

# ── UART / Serial ─────────────────────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ── Device drivers ────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_SPI=y

# ── RNG ───────────────────────────────────────────────────────────────────────
CONFIG_ENTROPY_GENERATOR=y

# Larger log buffer to avoid message drops
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=2

# Force synchronous printk (bypass deferred log redirect)
CONFIG_LOG_PRINTK=n
