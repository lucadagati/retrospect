# Wasmbed OCRE firmware — native_sim/native/64 (NSOS: host sockets, no TAP)

# ── native_sim platform ───────────────────────────────────────────────────────
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=10485760
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_UART_NATIVE_PTY=y

# ── NSOS: bypass Zephyr net stack, use host Linux sockets directly ─────────────
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# IPv6 DAD requires lower-level net interface access, not available via NSOS
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_IPV6=n

# ── Memory: larger heap for native_sim (no MMU pressure) ──────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192

# ── No DHCP: NSOS uses host networking directly, no IP config needed ───────────
CONFIG_NET_DHCPV4=n

# ── No board-specific HW drivers (not available on native_sim) ────────────────
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_NET_L2_ETHERNET=n

# ── Disable unused STM32-specific drivers ─────────────────────────────────────
CONFIG_SERIAL=n
CONFIG_UART_INTERRUPT_DRIVEN=n
