# native_sim/native/64 — embed-proplet board config
# Uses NSOS (Native Offloaded Sockets): Zephyr socket calls bypass the Zephyr
# network stack and go directly to host Linux sockets. No TAP device needed.
# The MQTT broker is reachable at 127.0.0.1:1883 (host loopback).

# ── NSOS: bypass Zephyr net stack, use host Linux sockets directly ─────────────
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# IPv6 not needed; DAD requires lower-level net interface not available via NSOS
CONFIG_NET_IPV6=n
CONFIG_NET_IPV6_DAD=n

# NSOS bypasses IP stack — no DHCP or L2 config needed
CONFIG_NET_DHCPV4=n
CONFIG_NET_DHCPV4_SERVER=n
CONFIG_NET_L2_ETHERNET=n

# ── Memory: larger heap for native_sim (no MMU pressure) ──────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=8388608
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192

# ── No WiFi on native_sim ─────────────────────────────────────────────────────
CONFIG_WIFI=n
CONFIG_WIFI_NM=n

# ── No board-specific HW drivers ─────────────────────────────────────────────
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_SERIAL=n
CONFIG_UART_INTERRUPT_DRIVEN=n

# ── Settings: disabled on native_sim, use compile-time defaults ───────────────
CONFIG_SETTINGS=n
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
